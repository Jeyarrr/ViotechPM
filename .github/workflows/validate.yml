name: Validate source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: viotechpm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d viotechpm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable runner-only database; no application or deployment secrets.
      DATABASE_URL: postgresql://ci:isolated_ci_only@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://ci:isolated_ci_only@localhost:5432/viotechpm_test
      CLIENT_ORIGIN: http://localhost:5173
      BOOTSTRAP_ADMIN_EMAIL: acceptance@test.viotech.local
      BOOTSTRAP_ADMIN_NAME: Acceptance Administrator
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Generate ephemeral test credentials
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          for (const name of ['SESSION_SECRET', 'BOOTSTRAP_ADMIN_PASSWORD']) {
            const value = randomBytes(48).toString('hex');
            console.log('::add-mask::' + value);
            appendFileSync(process.env.GITHUB_ENV, name + '=' + value + '\n');
          }
          JS
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Generate Prisma client
        run: npm run db:generate
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Full backend tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Responsive browser acceptance
        run: npm run test:e2e
      - name: Frontend and backend builds
        run: npm run build
      - name: Compiled runtime startup and shutdown
        run: node scripts/smoke-runtime.mjs
