# Free test deployment: documents disabled; existing test login explicitly allowed.
# Add actual frontend origin and database/session settings before deployment.
services:
  - type: web
    name: viotechpm-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SAME_SITE
        value: lax
      - key: REMINDERS_ENABLED
        value: 'false'
      - key: DOCUMENTS_ENABLED
        value: 'false'
      - key: HOSTED_TEST_MODE
        value: 'true'
      - key: TEST_ADMIN_EMAIL
        sync: false
      - key: PRODUCTION_READY_ACK
        value: 'false'
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: REALTIME_DATABASE_URL
        sync: false
